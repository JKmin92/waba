<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WABA — Master Design System (7 Core Pages · Light &amp; Dark Mode)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #FAFBFD;
      --card: #FFFFFF;
      --ink: #111115;
      --ink-2: #4E4E58;
      --ink-3: #8E8E98;
      --line: #EAEAEF;
      --purple: #6338A9;
      --purple-soft: #F6EBFB;
      --purple-text: #6338A9;
      --purple-border: #E5D4F3;
      --studio-bg: #ECECF2;
      --green-bg: #ECFDF5;
      --green-ink: #059669;
      --blue-bg: #EFF6FF;
      --blue-ink: #2563EB;
      --red-bg: #FEF2F2;
      --red-ink: #DC2626;
      --glass-btn: rgba(255,255,255,0.92);
    }

    [data-theme="dark"] {
      --bg: #0F1014;
      --surface: #171921;
      --card: #14161D;
      --ink: #F4F5F8;
      --ink-2: #A5A8B8;
      --ink-3: #727688;
      --line: #262936;
      --purple: #6338A9;
      --purple-soft: #261A3A;
      --purple-text: #A984EE;
      --purple-border: #3B285B;
      --studio-bg: #090A0D;
      --green-bg: rgba(16, 185, 129, 0.14);
      --green-ink: #34D399;
      --blue-bg: rgba(59, 130, 246, 0.16);
      --blue-ink: #60A5FA;
      --red-bg: rgba(239, 68, 68, 0.16);
      --red-ink: #F87171;
      --glass-btn: rgba(20,22,29,0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--studio-bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Studio Topbar */
    .studio-bar {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .studio-tabs {
      display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 999px; border: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .studio-tab {
      border: none; background: transparent; color: var(--ink-2);
      font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .studio-tab.active { background: var(--purple); color: #fff; }
    .theme-toggle {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }

    .canvas { padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
    .artboard { width: 1440px; display: none; flex-direction: column; gap: 10px; }
    .artboard.is-active { display: flex; }
    .art-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
    .pill { background: var(--purple); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }

    .frame-pc {
      width: 1440px; background: var(--bg); border-radius: 20px; overflow: hidden;
      border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,0.14);
    }

    body.capture-mode .studio-bar { display: none; }
    body.capture-mode .canvas { padding: 20px; }

    /* Master Shell & Left Sidebar */
    .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 920px; background: var(--bg); }
    .left-rail {
      border-right: 1px solid var(--line); padding: 26px 18px 22px;
      display: flex; flex-direction: column; justify-content: space-between; background: var(--bg);
    }
    .brand-logo { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--ink); }
    .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); }
    .side-nav { display: grid; gap: 4px; margin-top: 26px; }
    .side-item {
      padding: 11px 12px; border-radius: 13px; font-size: 14px; font-weight: 600;
      color: var(--ink-2); display: flex; align-items: center; gap: 11px;
    }
    .side-item.on { background: var(--purple-soft); color: var(--purple-text); font-weight: 700; }
    .cta-upload {
      margin-top: 18px; height: 44px; border-radius: 14px; background: var(--purple); color: #fff;
      font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 8px 20px rgba(99, 56, 169, 0.28);
    }
    .pet-widget {
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px;
    }
    .pet-widget-top { display: flex; align-items: center; gap: 10px; }
    .pet-widget-top img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--card); }
    .pet-widget-note { background: var(--card); border-radius: 10px; padding: 7px 10px; font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); }

    /* Common UI */
    .page-pad { padding: 24px 36px 44px; display: flex; flex-direction: column; gap: 22px; background: var(--bg); }
    .top-controls { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .ul-tabs { display: flex; gap: 24px; }
    .ul-tab { font-size: 14px; font-weight: 600; color: var(--ink-3); position: relative; padding-bottom: 12px; margin-bottom: -13px; }
    .ul-tab.on { color: var(--ink); font-weight: 800; }
    .ul-tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: var(--purple); border-radius: 999px; }

    .pill-btn {
      height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); font-size: 12px; font-weight: 600; color: var(--ink-2);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill-btn.primary { background: var(--purple); color: #fff; border-color: var(--purple); }
    .search-pill {
      width: 240px; height: 34px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3);
    }
    .badge-purple {
      display: inline-block; background: var(--purple-soft); color: var(--purple-text);
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
    .chip.on { background: var(--purple); color: #fff; border-color: var(--purple); }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: stretch; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .snap-media { height: 215px; position: relative; overflow: hidden; flex-shrink: 0; }
    .snap-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .snap-pill {
      position: absolute; top: 12px; left: 12px; background: var(--glass-btn); backdrop-filter: blur(8px);
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: var(--ink);
    }
    .bookmark-btn {
      position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
      background: var(--glass-btn); display: flex; align-items: center; justify-content: center; color: var(--ink);
    }
    .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
    .author-mini { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-weight: 600; }
    .author-mini img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }

    /* Page 1: Home A-1 */
    .e1-hero-row { display: grid; grid-template-columns: 1.85fr 1fr; gap: 18px; height: 320px; }
    .cinematic-spot { position: relative; border-radius: 24px; overflow: hidden; }
    .cinematic-spot img.bg-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cinematic-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,16,20,0.08) 0%, rgba(15,16,20,0.85) 100%); }
    .cinematic-top { position: absolute; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .cinematic-bottom { position: absolute; left: 22px; right: 22px; bottom: 20px; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; color: #fff; }
    .avatar-stack { display: flex; align-items: center; }
    .avatar-stack img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; margin-left: -8px; }
    .avatar-stack img:first-child { margin-left: 0; }
    .e1-right-stack { display: flex; flex-direction: column; gap: 14px; height: 320px; }
    .e1-pet-box {
      flex: 1; background: linear-gradient(145deg, var(--card) 0%, var(--purple-soft) 100%);
      border: 1px solid var(--purple-border); border-radius: 20px; padding: 16px 18px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .e1-hot-qa {
      flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .qa-reply-box {
      background: var(--surface); border-radius: 12px; padding: 10px 12px;
      display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2);
    }
    .qa-reply-box img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }

    /* Page 3: Detail */
    .detail-editorial { max-width: 820px; width: 100%; margin: 0 auto; display: grid; gap: 20px; }
    .pin-hero-box { position: relative; border-radius: 22px; overflow: hidden; height: 390px; }
    .pin-hero-box img.main-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .map-pin {
      position: absolute; padding: 6px 12px; border-radius: 999px;
      background: rgba(17,17,21,0.86); color: #fff; font-size: 11px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid rgba(255,255,255,0.7);
    }
    .linked-journey {
      background: linear-gradient(135deg, var(--purple-soft) 0%, var(--surface) 100%);
      border: 1px solid var(--purple-border); border-radius: 18px; padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .comment-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 12px; }
    .comment-item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
    .comment-item.pinned { background: var(--purple-soft); border-color: var(--purple-border); }

    /* Page 5: Notebook Detail & Page 7: Mypage */
    .tl-item {
      display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center;
      padding: 15px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
    }
    .tl-item.ai { background: var(--purple-soft); border-color: var(--purple-border); }
  </style>
</head>
<body data-theme="light">

  <header class="studio-bar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="pill">WABA MASTER DESIGN</span>
      <span style="font-size:13px;font-weight:700;">전체 7개 페이지 통합 마스터 시안</span>
    </div>
    <div class="studio-tabs">
      <button class="studio-tab active" data-target="home" onclick="setPage('home')">1. 메인</button>
      <button class="studio-tab" data-target="board" onclick="setPage('board')">2. 커뮤니티</button>
      <button class="studio-tab" data-target="detail" onclick="setPage('detail')">3. 글 상세</button>
      <button class="studio-tab" data-target="nb-list" onclick="setPage('nb-list')">4. 수첩 리스트</button>
      <button class="studio-tab" data-target="nb-detail" onclick="setPage('nb-detail')">5. 수첩 상세</button>
      <button class="studio-tab" data-target="register" onclick="setPage('register')">6. 글 작성</button>
      <button class="studio-tab" data-target="mypage" onclick="setPage('mypage')">7. 마이페이지</button>
    </div>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 다크 모드</button>
  </header>

  <main class="canvas" id="app"></main>

  <script>
    const ICONS = {
      home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
      comm: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      care: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>',
      book: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      user: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      bm: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
      bmFill: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
    };

    const IMG = {
      mong: 'https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=800&q=80',
      bori: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=800&q=80',
      rui: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800&q=80',
      koko: 'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=600&q=80',
      mochi: 'https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=600&q=80',
      dubu: 'https://images.unsplash.com/photo-1560807707-8cc77767d783?w=600&q=80',
      mom: 'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=200&q=80',
      cat2: 'https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=200&q=80'
    };

    function sidebar(active) {
      const items = [
        ['home', '홈', ICONS.home],
        ['comm', '커뮤니티', ICONS.comm],
        ['care', '케어 저니', ICONS.care],
        ['book', '건강 수첩', ICONS.book],
        ['user', '마이페이지', ICONS.user]
      ];
      return `
        <aside class="left-rail">
          <div>
            <div class="brand-logo">WABA<span class="brand-dot"></span></div>
            <nav class="side-nav">
              ${items.map(([k, label, icon]) => `<div class="side-item ${active === k ? 'on' : ''}">${icon} ${label}</div>`).join('')}
            </nav>
            <div class="cta-upload">+ 올리기</div>
          </div>
          <div class="pet-widget">
            <div class="pet-widget-top">
              <img src="${IMG.mong}" alt="몽글" />
              <div>
                <div style="font-size:13px;font-weight:800;">몽글 <span style="font-size:11px;font-weight:600;color:var(--ink-3);">3.8kg</span></div>
                <div style="font-size:11px;color:var(--purple-text);font-weight:600;">✓ 접종 D-12</div>
              </div>
            </div>
            <div class="pet-widget-note">최근: <strong>발톱 깎기 완료</strong></div>
          </div>
        </aside>
      `;
    }

    const pages = [
      {
        id: 'home',
        badge: '1. 메인 페이지 (/)',
        desc: '진화안 A-1 기준 — 풀블리드 시네마틱 스포트라이트 + Q&A/스냅 분리',
        side: 'home',
        content: `
          <div class="top-controls">
            <div class="ul-tabs"><span class="ul-tab on">전체</span><span class="ul-tab">인기 스냅</span><span class="ul-tab">건강 Q&amp;A</span><span class="ul-tab">케어 저니 · 치료기</span></div>
            <div style="display:flex;gap:10px;align-items:center;"><span class="pill-btn">인기순 ▾</span><div class="search-pill">🔍 사진, 질문, 케어 저니 검색</div></div>
          </div>
          <section class="e1-hero-row">
            <article class="cinematic-spot">
              <img class="bg-photo" src="${IMG.bori}" alt="" />
              <div class="cinematic-grad"></div>
              <div class="cinematic-top">
                <span style="background:var(--purple);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;">TODAY'S SPOTLIGHT · DAY 56</span>
                <span style="background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;">76% 목표 달성</span>
              </div>
              <div class="cinematic-bottom">
                <div>
                  <h2 style="font-size:23px;font-weight:800;line-height:1.3;">노령견 디스크 수술 없이<br/>수중 재활 8주차 극복 기록</h2>
                  <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
                    <div class="avatar-stack"><img src="${IMG.bori}" /><img src="${IMG.koko}" /><img src="${IMG.mochi}" /></div>
                    <span style="font-size:12px;opacity:0.9;">보리집사 외 128명 응원 중 · ♥ 342</span>
                  </div>
                </div>
                <span style="background:#fff;color:#111115;font-size:12px;font-weight:700;padding:9px 16px;border-radius:999px;">케어 저니 보기 →</span>
              </div>
            </article>
            <div class="e1-right-stack">
              <div class="e1-pet-box">
                <div style="display:flex;justify-content:space-between;"><span style="font-size:11px;font-weight:800;color:var(--purple-text);">내 펫 AI 수첩</span><span style="font-size:11px;color:var(--ink-3);">오늘 1/3 완료</span></div>
                <div style="font-size:16px;font-weight:800;line-height:1.35;">몽글이 산책 &amp; 체중<br/>3.8kg 안정 유지 중</div>
                <div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:var(--ink-2);">다음 종합백신 D-12</span><span style="font-weight:700;color:var(--purple-text);">기록하기 →</span></div>
              </div>
              <div class="e1-hot-qa">
                <div style="display:flex;justify-content:space-between;"><span style="font-size:11px;font-weight:800;">🔥 실시간 핫 Q&amp;A</span><span style="font-size:11px;color:var(--purple-text);font-weight:700;">답변 28개</span></div>
                <div style="font-size:14px;font-weight:700;line-height:1.4;">유산균 급여 후 묽은 변 3일째, 중단해야 할까요?</div>
                <div style="font-size:11px;color:var(--ink-3);">김다은 수의사 외 4명 답변 작성 중...</div>
              </div>
            </div>
          </section>
