<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WABA - 대량 펫 검색·선택 모달/사이드바 시안 (#3, #4, #6, #7)</title>
  <style>
    :root {
      --primary: #6338A9;
      --primary-light: #F3EEFA;
      --bg: #F8F7FC;
      --card: #FFFFFF;
      --text: #1E1B2E;
      --muted: #6E6A80;
      --border: #E6E2F0;
      --radius-lg: 20px;
      --radius-pill: 9999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px; display: flex; justify-content: center; }
    .modal { width: 480px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 16px 40px rgba(30, 27, 46, 0.14); overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 17px; font-weight: 700; }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
    .search-box { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; outline: none; }
    .search-box:focus { border-color: var(--primary); }
    .selected-summary { display: flex; flex-wrap: wrap; gap: 6px; max-height: 76px; overflow-y: auto; padding: 8px; background: #FAF9FD; border-radius: 12px; border: 1px dashed #D9CCF2; }
    .sel-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: var(--radius-pill); background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 700; }
    .list-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .virtual-list { height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
    .list-row:hover { background: #F5F2FA; }
    .row-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
    .check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
    .check.on { background: var(--primary); }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 10px 18px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
    .btn-ghost { background: #F1EEF8; color: var(--text); }
    .btn-primary { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div class="modal">
    <div class="modal-header">
      <h3>동반 반려동물 선택 (10,000마리 대응)</h3>
      <span style="color:#6E6A80;cursor:pointer;">✕</span>
    </div>
    <div class="modal-body">
      <input class="search-box" type="text" placeholder="반려동물 이름 또는 품종 검색..." />
      <div class="selected-summary">
        <span class="sel-chip">초코 ✕</span>
        <span class="sel-chip">보리 ✕</span>
        <span class="sel-chip">두부 ✕</span>
        <span class="sel-chip" style="background:#EAE5F5;">+ 12마리 더 선택됨</span>
      </div>
      <div class="list-meta">
        <span>전체 10,000마리 중 검색 결과</span>
        <span style="color:var(--primary);font-weight:700;cursor:pointer;">선택 초기화</span>
      </div>
      <div class="virtual-list">
        <div class="list-row"><div class="row-left"><div class="avatar">초</div><div><div style="font-size:14px;font-weight:600;">초코</div><div style="font-size:11px;color:#6E6A80;">푸들 · 3살</div></div></div><div class="check on">✓</div></div>
        <div class="list-row"><div class="row-left"><div class="avatar">보</div><div><div style="font-size:14px;font-weight:600;">보리</div><div style="font-size:11px;color:#6E6A80;">코숏 · 2살</div></div></div><div class="check on">✓</div></div>
        <div class="list-row"><div class="row-left"><div class="avatar">두</div><div><div style="font-size:14px;font-weight:600;">두부</div><div style="font-size:11px;color:#6E6A80;">말티즈 · 5살</div></div></div><div class="check on">✓</div></div>
        <div class="list-row"><div class="row-left"><div class="avatar">콩</div><div><div style="font-size:14px;font-weight:600;">콩이</div><div style="font-size:11px;color:#6E6A80;">포메라니안 · 1살</div></div></div><div class="check"></div></div>
        <div class="list-row"><div class="row-left"><div class="avatar">루</div><div><div style="font-size:14px;font-weight:600;">루이</div><div style="font-size:11px;color:#6E6A80;">러시안블루 · 4살</div></div></div><div class="check"></div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost">취소</button>
      <button class="btn btn-primary">15마리 선택 완료</button>
    </div>
  </div>
</body>
</html>
